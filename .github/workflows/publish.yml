name: Publish to PyPI and GitHub Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Run tests
        run: uv run pytest

  build:
    name: Build distribution packages
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Store built packages
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  publish-pypi:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dpm-tool
    permissions:
      id-token: write # Mandatory for PyPI Trusted Publishing (OIDC - no token secret needed)
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Publish package to PyPI
        run: uv publish dist/*

  upload-release-assets:
    name: Upload assets to GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write # Required to attach release assets
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
